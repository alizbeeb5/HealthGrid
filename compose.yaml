# Local development only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthgrid}
      POSTGRES_USER: ${POSTGRES_USER:-healthgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthgrid_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      SECURITY_USERNAME: ${SECURITY_USERNAME:-healthgrid}
      SECURITY_PASSWORD: ${SECURITY_PASSWORD:-}
      SECURITY_ALLOWED_HOSTS: ${SECURITY_ALLOWED_HOSTS:-["localhost","127.0.0.1","api"]}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000","http://127.0.0.1:8000"]}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-healthgrid}:${POSTGRES_PASSWORD:-healthgrid_local}@db:5432/${POSTGRES_DB:-healthgrid}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ASSESSMENT_MODEL: ${OPENAI_ASSESSMENT_MODEL:-gpt-6-luna}
      OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:-}
      OPENAI_EMERGENCY_MODEL: ${OPENAI_EMERGENCY_MODEL:-gpt-6-luna}
      OPENAI_INTELLIGENCE_TIMEOUT_SECONDS: ${OPENAI_INTELLIGENCE_TIMEOUT_SECONDS:-15}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./data/synthetic:/workspace/data/synthetic:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --limit-concurrency 64 --timeout-keep-alive 5
    depends_on:
      db:
        condition: service_healthy
  web:
    user: node
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      SECURITY_SESSION_SECRET: ${SECURITY_SESSION_SECRET:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      SECURITY_USERNAME: ${SECURITY_USERNAME:-healthgrid}
      SECURITY_PASSWORD: ${SECURITY_PASSWORD:-}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000","http://127.0.0.1:8000"]}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - api
volumes:
  postgres_data:
  web_node_modules:
  web_next:
